{const t=new THREE.Sprite(new THREE.SpriteMaterial({map:txtTex(CL,160,64,42,'#1d2a44','#fffffff0'),depthTest:false}));t.scale.set(.8,.32,1);t.position.set(cx*M,(topZ+260)*M,(f12?R.y+R.h/2:R.y-260)*M);cluster.add(t)}
{const full=CELLS.filter(c=>c.userData.full).length;$('hT').textContent='Cụm '+CL+' · '+tiers.length+' tầng · '+CELLS.length+' ô · '+full+' ô có nhãn'+(kyKK.size?' · ⛔ có vật tư kỵ nhau (đỏ nhấp nháy)':'')}
/* ---- camera ---- */

const HOME=new THREE.Vector3(ctr.x+(f12?0:(KG.FACE[CL.split('.')[0]]==='E'?1:-1)*dist*.9),ctr.y+dist*.35,ctr.z+(f12?dist:dist*.15));

$('bReset').onclick=home;$('bFlip').onclick=()=>{rollT=rollT?0:Math.PI;$('bFlip').classList.toggle('on',!!rollT)};$('cNg').onchange=e=>{NG.visible=e.target.checked};

const cvEl=$('cv');cvEl.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});

const LID=new Set([6,7,8,9,10]),TYD={1:[273,210,420],2:[420,135,600],3:[420,305,600],5:[420,370,600],6:[360,290,545],7:[310,225,455],8:[400,400,500],9:[400,145,590],10:[300,230,400],11:[420,370,600],12:[420,370,600]};
let lidMesh=null,lidOpen=true;
function clearBox(){while(boxG.children.length){const c=boxG.children.pop();c.traverse&&c.traverse(o=>{if(o.material&&o.material.dispose)o.material.dispose()})}}
function boxDims(code,items){const tn=items[0]&&parseInt(String(items[0].type).replace(/\D/g,''))||0;return{t:tn,d:TYD[tn]||[300,210,420]}}
function buildBox(code,items){clearBox();const {t,d}=boxDims(code,items),W=d[0]*M,Hh=d[1]*M,D=d[2]*M,wall=.008,bm=mat(0x4d8fd6,{transparent:true,opacity:.55,side:THREE.DoubleSide});

 lidMesh=null;if(LID.has(t)){const lg=new THREE.Group();lg.add(mk(UB,W+.01,wall,D+.01,0,0,D/2,mat(0x1e5fa8)));lg.position.set(0,Hh,-D/2);lg.rotation.x=lidOpen?-1.9:0;boxG.add(lg);lidMesh=lg}
