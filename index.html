<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tra cứu kiểm kê</title>

<style>
/* Layout: thẻ nhãn một cột trên điện thoại, giống tờ nhãn KK; ô huy hiệu đỏ tròn như tem dán trên ô box */
:root{--bg:#f3f4f6;--card:#ffffff;--fg:#14202e;--mute:#5a6675;--line:#d4d9e0;--ink:#1d3fa8;--badge:#c8202b;--badgefg:#ffffff;--warn:#8a5a00;--warnbg:#fff3d1;--ok:#17653a;--okbg:#e2f4e8;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141c;--card:#17202b;--fg:#e8edf3;--mute:#9aa6b5;--line:#2c3846;--ink:#8fb0ff;--badge:#e04a54;--badgefg:#ffffff;--warn:#f2c46b;--warnbg:#3a2e12;--ok:#7fd6a1;--okbg:#14301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141c;--card:#17202b;--fg:#e8edf3;--mute:#9aa6b5;--line:#2c3846;--ink:#8fb0ff;--badge:#e04a54;--badgefg:#ffffff;--warn:#f2c46b;--warnbg:#3a2e12;--ok:#7fd6a1;--okbg:#14301f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.search input:focus{outline:2px solid var(--ink);outline-offset:1px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:6px;padding:12px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.code{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:.01em}
.loc{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600;text-decoration:none}
.badge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--badge);color:var(--badgefg);display:grid;place-items:center;font-weight:600;font-size:22px}
.name{padding:14px 16px 4px;font-size:21px;font-weight:600;line-height:1.3;text-wrap:balance}
.sub{padding:0 16px;color:var(--mute);font-size:14px}
.qty{display:flex;align-items:baseline;gap:8px;padding:12px 16px 4px}
.qty b{font-size:44px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.qty span{font-size:18px;color:var(--mute)}
.qd{padding:0 16px 12px;color:var(--mute);font-size:14px}
dl{margin:0;padding:6px 16px 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
dt{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.full{grid-column:1/-1}
.note{margin:0 16px 14px;padding:10px 12px;border-radius:6px;font-size:14px;background:var(--warnbg);color:var(--warn)}
.note.ok{background:var(--okbg);color:var(--ok)}
.note strong{display:block;margin-bottom:2px}
.plain{margin:0 16px 14px;font-size:14px;color:var(--mute)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
.row .badge{width:36px;height:36px;font-size:16px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .t small{color:var(--mute);font-family:var(--mono)}
.row .n{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.sum{padding:12px 16px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.empty{padding:20px 16px;color:var(--mute)}
.pill{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle;padding:3px 8px;border-radius:999px;background:var(--okbg);color:var(--ok)}
.foot{font-size:13px;color:var(--mute)}
a{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 12px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.open{display:block;width:calc(100% - 32px);margin:4px 16px 16px;padding:14px;border:0;border-radius:8px;background:var(--ink);color:#fff;font:600 16px var(--sans);cursor:pointer}
.zone{padding:0 16px;margin:0 0 8px}.fun{margin:0;padding:8px 16px 12px 32px;color:var(--fg);font-size:15px}
.plan{width:100%;height:auto;display:block}.plan a{cursor:pointer}.plan .pl{fill:var(--card);stroke:var(--mute);stroke-width:1}.plan .pl.has{fill:var(--okbg);stroke:var(--ok)}.plan .pl.hl{fill:#ffb347;stroke:#b36b00;stroke-width:2}
.plan .pt{font:600 15px var(--sans);fill:var(--fg)}.plan .ps{font:12px var(--sans);fill:var(--mute)}.plan a:hover .pl{stroke:var(--ink);stroke-width:2}
.back{display:inline-block;margin-bottom:2px;font-weight:600}
.elev{padding:4px 12px 14px;overflow-x:auto}.tang{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}.tang.foc{background:var(--warnbg)}
.tl{flex:none;width:30px;font:600 13px var(--mono);color:var(--mute)}.trows{display:flex;flex-direction:column;gap:3px}.cells{display:flex;gap:3px}
.cell{flex:none;min-width:34px;text-align:center;padding:7px 2px;border:1px solid var(--line);border-radius:4px;font:600 13px var(--mono);text-decoration:none;color:var(--mute);background:var(--bg)}
.cell.has{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.cell.hl{background:#ffb347;color:#3a2300;border-color:#b36b00}
</style>
</head><body>

  s+='<rect class="pl" x="622" y="310" width="312" height="56" rx="3" style="stroke-dasharray:4 3"/><text x="778" y="342" text-anchor="middle" class="ps">KHU PHỤ / THIẾT BỊ</text></svg>';
  return '<div class="card" style="padding:10px;overflow-x:auto">'+s+'</div>';
}
function search(t){
  var tk=fold(t).split(/\s+/).filter(Boolean); if(!tk.length)return '';
  var rs=DATA.filter(function(r){var h=hay(r);return tk.every(function(k){return h.indexOf(k)>=0})});
  HL={};rs.forEach(function(r){HL[r.vt]=(HL[r.vt]||0)+1});
  if(!rs.length)return '<div class="card"><div class="empty">Không thấy "'+esc(t)+'" trong dữ liệu.</div></div>';
  var locs=Object.keys(HL).length;
  return planSVG()+'<div class="card"><div class="head"><div><div class="code">'+rs.length+' kết quả</div><span class="sub" style="padding:0">ở '+locs+' ô (đã tô cam trên bản đồ)</span></div></div><div class="list">'+rs.slice(0,50).map(row).join('')+'</div></div>';
}
function home(){
  HL={};var locs=occ();
  var h=planSVG()+'<div class="card"><div class="head"><div><div class="code">'+DATA.length+' phiếu</div><span class="sub" style="padding:0">Gõ từ khóa (VD: que hàn 3.2), hoặc bấm cụm trên bản đồ, hoặc bấm ô bên dưới</span></div></div><div class="list">';
  Object.keys(locs).sort().forEach(function(l){h+='<a class="row" href="#'+hashOf(l)+'"><span class="t"><b>'+esc(l)+'</b></span><span class="n">'+locs[l]+' dòng</span></a>'});
  return h+'</div></div>';
}
var VT_IDX=null;
function vtIdx(){if(VT_IDX)return VT_IDX;VT_IDX={};(window.KHO_VITRI||[]).forEach(function(e){(VT_IDX[e[1]]=VT_IDX[e[1]]||[]).push(e)});return VT_IDX}
function gridFor(cl,o,tangFocus){
  var es=vtIdx()[cl]||[]; if(!es.length)return '<div class="card"><div class="empty">Cụm '+esc(cl)+' chưa có trong danh mục ô.</div></div>';
  var tangs=[];es.forEach(function(e){if(tangs.indexOf(e[2])<0)tangs.push(e[2])});tangs.sort(function(a,b){return b-a});
  var h='<div class="card"><div class="head"><div><div class="code">'+esc(cl)+'</div><span class="sub" style="padding:0">Mặt đứng: tầng trên cùng ở trên. Ô xanh = có nhãn, ô cam = khớp tìm kiếm</span></div></div><div class="elev">';
  tangs.forEach(function(t){
    h+='<div class="tang'+(tangFocus===t?' foc':'')+'"><b class="tl">T'+t+'</b><div class="trows">';
    [0,1,2].forEach(function(rk){
      var cells=es.filter(function(e){return e[2]===t&&e[4]===rk}).sort(function(a,b){return a[3]-b[3]});
      if(!cells.length)return;
      h+='<div class="cells">'+cells.map(function(e){var c=e[0];var cls='cell'+(HL[c]?' hl':(o[c]?' has':''));
        return '<a class="'+cls+'" href="#'+hashOf(c)+'" title="'+c+(o[c]?' — '+o[c]+' nhãn':' — chưa có nhãn')+'">'+e[3]+'</a>'}).join('')+'</div>';
    });
    h+='</div></div>';
  });
  return h+'</div></div>';
}
function clusterView(l){
  if(!window.KHO_VITRI)return '<div class="card"><div class="empty">Thiếu file vi_tri.js (phải nằm cùng thư mục với trang này) nên chưa vẽ được các ô.</div></div>';
  var p=l.split('.'),o=occ(),idx=vtIdx(),cls=[];
  if(p.length>=2)cls=[p[0]+'.'+p[1]]; else cls=Object.keys(idx).filter(function(c){return c.split('.')[0]===p[0]});
  var tf=p.length===3?+p[2]:0;
  if(!cls.length)return '<a class="back" href="#">← Bản đồ kho</a><div class="card"><div class="empty">Không có dãy "'+esc(l)+'" trong danh mục.</div></div>';
  return '<a class="back" href="#">← Bản đồ kho</a>'+cls.map(function(c){return gridFor(c,o,tf)}).join('');
}
function locView(l){var p=l.split('.');
  if(p.length>=4)return '<a class="back" href="#'+hashOf(p[0]+'.'+p[1])+'">← Cụm '+p[0]+'.'+p[1]+' (mặt đứng)</a>'+boxView(l);
  return clusterView(l);
}
function render(){
  var h=decodeURIComponent(location.hash.replace(/^#/,''));if(!h){var mq=/[?&]o=([^&]+)/.exec(location.search);if(mq)h=decodeURIComponent(mq[1]);}
  var k=normKK(h), l=h?normLoc(h):null, html;
  if(k){var r=DATA.filter(function(x){return x.kk===k})[0];
    html=r?card(r):'<div class="card"><div class="head"><div class="code">'+k+'</div></div><div class="empty">Mã này chưa có trong dữ liệu (cập nhật '+UPDATED+'). Có thể nhãn mới kiểm kê sau ngày đó.</div></div>';}
  else if(l){html=locView(l);}
  else if(q.value.trim()){html=search(q.value);}
  else html=home();
  out.innerHTML=html; window.scrollTo(0,0);
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var v=q.value.trim();var k=normKK(v),l=normLoc(v);
  if(k||l){location.hash=k||hashOf(l);}else if(location.hash){location.hash='';}else{render();}});
q.addEventListener('input',function(){if(location.hash){location.hash='';}else{render();}});
window.addEventListener('hashchange',render);

/* ===== NGUỒN DỮ LIỆU SỐNG: dán link CSV của Google Sheets (Publish to web) vào dòng dưới =====
   Để trống thì trang dùng dữ liệu nhúng sẵn (bản chụp). */
var SHEET_CSV='';
var HEAD={'mã kk':'kk','vị trí':'vt','huy hiệu':'hh','sku':'sku','loại box':'type','mã lô':'lo','tên vật tư':'ten','số lượng':'sl','đvt':'dvt','số box × sl/box':'sld','ngày nhập':'nn','nsx':'nsx','hsd':'hsd','mới/cũ':'mc','tình trạng':'tt','mất nhãn gốc':'mnh','kích thước':'kt','người kiểm':'nk','người dự trù':'dt','ngày kiểm':'ngk','mức chắc chắn':'cc','ghi chú':'gc','độ rõ':'ai','cần xác nhận':'cx','hãng':'hang','model':'model','ncc':'ncc','loại phiếu':'loai','bộ phận':'bp','khu/máy':'km','mã thiết bị':'mtb'};
function parseCSV(t){var rows=[],r=[],f='',q=false,i=0,c;t=t.replace(/^\uFEFF/,'');
  for(;i<t.length;i++){c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===','){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function loadSheet(){
  if(!SHEET_CSV){render();return}
  fetch(SHEET_CSV+(SHEET_CSV.indexOf('?')<0?'?':'&')+'t='+Date.now()).then(function(x){if(!x.ok)throw 0;return x.text()}).then(function(t){
    var rows=parseCSV(t);if(rows.length<2)throw 0;
    var keys=rows[0].map(function(h){h=h.trim().toLowerCase();return HEAD[h]||h});
    var d=[];rows.slice(1).forEach(function(r){var o={};keys.forEach(function(k,i){o[k]=(r[i]||'').trim()});if(/^KK-/i.test(o.kk)||o.loai)d.push(o)});
    if(d.length){DATA=d;UPDATED='Google Sheets, '+new Date().toLocaleString('vi-VN')}
    render();
  }).catch(function(){UPDATED=UPDATED+' (không tải được Google Sheets, đang dùng bản chụp)';render()});
}
loadSheet();
</script>
