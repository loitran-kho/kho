.back{display:inline-block;margin:0 6px 8px 0;font-weight:600;border:1.5px solid var(--line);border-radius:10px;padding:8px 13px;background:var(--card);text-decoration:none}.back:hover{border-color:#1976d2}
.legend.dl{margin:10px 0 0}.legend.dl b{width:100%;font-weight:600}.legend.dl i{width:16px;height:10px;border-radius:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.chips button{border:1.5px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px}.chips button.on{background:#1976d2;border-color:#1976d2;color:#fff}
.td{border:2px solid #f9a825;background:#fff8e1;color:#4e3b00;border-radius:12px;padding:8px 12px;margin:10px 0}.td ul{margin:6px 0 0;padding-left:18px}.kn{border:2px solid #d32f2f;background:#ffebee;color:#7f0000;border-radius:12px;padding:8px 12px;margin:10px 0;font-weight:600}

.q3{float:right;border:1.5px solid #1976d2;background:var(--card);color:#1976d2;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;font-size:14px}
.m3{margin:10px 0}.m3 iframe{width:100%;height:420px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.qa{display:flex;gap:8px;margin:10px 0}.qa button{flex:1;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:inherit;padding:10px;font:inherit;font-weight:600}

#lbx{position:absolute;top:10px;right:12px;width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:#111;font-size:32px;line-height:1;cursor:pointer}
#lbc{color:#fff;font-size:15px;text-align:center;max-width:92vw}#lbo{color:#9bbcff;font-size:14px}
.pic{cursor:zoom-in}
.cap{margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px}.cap small{color:var(--mute);font-size:12.5px}.capt{font-size:14.5px}
.bar{height:12px;border-radius:6px;background:rgba(128,128,128,.25);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.bar i.cg,.legend i.cg{background:#2ea05a}.bar i.cy,.legend i.cy{background:#e9a21c}.bar i.cr,.legend i.cr{background:#d94040}
.bar i.cx,.legend i.cx{background:repeating-linear-gradient(135deg,#8b0000 0 8px,#b30000 8px 16px)}
.warn{color:#b00000;font-weight:700;font-size:14px}@media (prefers-color-scheme:dark){.warn{color:#ff8a8a}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--mute)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block}.legend i.has{background:var(--okbg);border-color:var(--ok)}.legend i.hlg{background:#ffb347;border-color:#b36b00}
.plan .pl.cg{fill:rgba(46,160,90,.45);stroke:#2ea05a}.plan .pl.cy{fill:rgba(233,162,28,.5);stroke:#d99a1e}.plan .pl.cr{fill:rgba(217,64,64,.5);stroke:#d94040}.plan .pl.cx{fill:rgba(139,0,0,.62);stroke:#8b0000}
.plan .pl.w{fill:var(--card)}.plan .wv.cg{fill:#8fd4a8}.plan .wv.cy{fill:#f2c46a}.plan .wv.cr{fill:#e88a8a}.plan .wv.cx{fill:#c24a4a}

@keyframes rs{from{transform:translateY(var(--h))}}@keyframes wx{to{transform:translateX(var(--w))}}

.cell.cg{background:rgba(46,160,90,.4);color:var(--fg);border-color:#2ea05a}.cell.cy{background:rgba(233,162,28,.5);color:var(--fg);border-color:#d99a1e}.cell.cr{background:rgba(217,64,64,.5);color:var(--fg);border-color:#d94040}.cell.cx{background:rgba(139,0,0,.6);color:var(--fg);border-color:#8b0000}
.cell.w{position:relative;overflow:hidden;isolation:isolate;background:var(--bg)}
.cell.w>span{position:relative;z-index:2}
.cell .wt{position:absolute;left:0;right:0;bottom:0;height:var(--lv);z-index:1;animation:rise 1.4s ease-out}
.cell .wt::before{content:'';position:absolute;left:50%;margin-left:-80px;top:-4px;width:160px;height:160px;border-radius:44%;background:inherit;animation:wv var(--sp,7s) linear infinite;animation-delay:var(--dl,0s)}
.cell.cg .wt{background:#8fd4a8}.cell.cy .wt{background:#f2c46a}.cell.cr .wt{background:#e88a8a}.cell.cx .wt{background:#c24a4a}
.cell.w.cg,.cell.w.cy,.cell.w.cr,.cell.w.cx{background:var(--bg)}
@keyframes rise{from{height:0}to{height:var(--lv)}}@keyframes wv{to{transform:rotate(360deg)}}

/* ===== NGUỒN DỮ LIỆU SỐNG: dán link CSV của Google Sheets (Publish to web) vào dòng dưới =====
   Để trống thì trang dùng dữ liệu nhúng sẵn (bản chụp). */
var SHEET_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vTeFZJ6kVoksGbJEoZ57orYuBI1m01E91CWwyqcPEj0M4gmICkzZXCUbgqS5_pKrWqf3lWrWcw5nrIq/pub?gid=0&single=true&output=csv';
var HEAD={'mã kk':'kk','vị trí':'vt','huy hiệu':'hh','sku':'sku','loại box':'type','mã lô':'lo','tên vật tư':'ten','số lượng':'sl','đvt':'dvt','số box × sl/box':'sld','ngày nhập':'nn','nsx':'nsx','hsd':'hsd','mới/cũ':'mc','tình trạng':'tt','mất nhãn gốc':'mnh','kích thước':'kt','người kiểm':'nk','người dự trù':'dt','ngày kiểm':'ngk','mức chắc chắn':'cc','ghi chú':'gc','độ rõ':'ai','cần xác nhận':'cx','hãng':'hang','model':'model','ncc':'ncc','loại phiếu':'loai','bộ phận':'bp','khu/máy':'km','mã thiết bị':'mtb'};
function parseCSV(t){var rows=[],r=[],f='',q=false,i=0,c;t=t.replace(/^\uFEFF/,'');
  for(;i<t.length;i++){c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===','){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}return rows}

function pad2(n){return(n<10?'0':'')+n}
function showDL(){var b=document.getElementById('dl'),w=document.getElementById('offl');if(!b||!w)return;w.hidden=false;
  b.onclick=function(){try{var n=new Date(),dt=pad2(n.getDate())+'/'+pad2(n.getMonth()+1)+'/'+n.getFullYear();
    var txt='/* Dữ liệu vật tư cho tra_cuu.html. Xuất từ Google Sheets bằng nút trên trang tra cứu. */\nwindow.KHO_DATA={updated:'+JSON.stringify(dt)+',rows:'+JSON.stringify(DATA)+'};\n';
    var bl=new Blob([txt],{type:'application/javascript;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='data.js';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
    document.getElementById('dlmsg').textContent='Đã tải data.js ('+DATA.length+' dòng, '+dt+'). Chép đè vào thư mục bản offline.'}catch(e){document.getElementById('dlmsg').textContent='Không tạo được file: '+e.message}}}
function loadSheet(){
  if(!SHEET_CSV){render();return}
  fetch(SHEET_CSV+(SHEET_CSV.indexOf('?')<0?'?':'&')+'t='+Date.now()).then(function(x){if(!x.ok)throw new Error('HTTP '+x.status);return x.text()}).then(function(t){
    if(/^\s*<(!doctype|html)/i.test(t))throw new Error('Google trả về trang web, không phải CSV');var rows=parseCSV(t);if(rows.length<2)throw new Error('CSV rỗng hoặc chỉ có tiêu đề');
    var keys=rows[0].map(function(h){h=h.trim().toLowerCase();return HEAD[h]||h});
    var d=[];rows.slice(1).forEach(function(r){var o={};keys.forEach(function(k,i){o[k]=(r[i]||'').trim()});if(/^KK-/i.test(o.kk)||o.loai)d.push(o)});
    var nb=0;if(d.length&&window.KHO_BOSUNG&&KHO_BOSUNG.rows){var hv={};d.forEach(function(o){hv[o.kk]=1});KHO_BOSUNG.rows.forEach(function(o){if(!hv[o.kk]){d.push(o);nb++}})}
    if(d.length){DATA=d;SRC='Google Sheets ('+(d.length-nb)+' dòng KK'+(nb?' + '+nb+' dòng bổ sung từ kho_bosung.js, chưa có trong Sheet':'')+')';UPDATED=new Date().toLocaleString('vi-VN')}else{UPDATED=UPDATED+' (Google Sheets tải được nhưng không có dòng KK hợp lệ. Cột đầu đọc được: '+rows[0].slice(0,4).join(' | ')+')'}
    setFoot();render();if(d.length)showDL();
  }).catch(function(e){UPDATED=UPDATED+' (không tải được Google Sheets: '+((e&&e.message)||'lỗi mạng/CORS')+'; đang dùng bản chụp)';setFoot();render()});
}var IMG_BASE='img/', IMG_BIG='img/big/';  /* đổi 2 dòng này nếu sau này chuyển ảnh sang nơi khác */

  document.addEventListener('click',function(e){

})();

<script>
(function(){

  var m=document.createElement('div');m.id='faq';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Cẩm nang sử dụng kho');
  m.innerHTML='<div class="fq"><button id="faqx" type="button" aria-label="Đóng">×</button><h2>Cẩm nang sử dụng kho</h2><p style="margin:0 0 10px"><button type="button" id="faqnk" style="min-height:44px;padding:0 14px;border:1.5px solid #1d3fa8;border-radius:10px;background:transparent;color:inherit;font:600 15px var(--sans)">📖 Ghi chép thao tác: bấm vào đây để mở Nhật ký</button></p><div class="tabs"><button type="button" class="tb on" data-t="a">Về sức chứa</button><button type="button" class="tb" data-t="b">Tra cứu &amp; Lấy đồ</button><button type="button" class="tb" data-t="c">🧭 Tìm &amp; Chỉ đường</button></div><div class="pn on" id="pna">'
  +'<h3>0. Con số % được tính thế nào?</h3><p>% = thể tích tất cả vật tư trong ô ÷ (thể tích lòng box × 0,8). Thể tích mỗi vật tư lấy từ kích thước ghi trong dữ liệu, nhân với số lượng. Hệ số 0,8 là ngưỡng an toàn (nguyên lý 80/20): 100% nghĩa là vật tư đã chiếm 80% lòng box.</p>'
  +'<h3>1. Tại sao hệ thống báo, ví dụ 59%, mà nhìn thấy còn trống nhiều?</h3><p>Vì hệ thống tính theo thể tích hình học (dài × rộng × cao). Khi xếp vật tư, góc hộp và khoảng trên nóc box có chỗ trống mà hệ thống không tính tới. Nhìn thấy ít hơn con số trên màn hình là bình thường.</p>'
  +'<h3>2. Tại sao hệ thống báo 59% mà nhét không vô?</h3><p>Vì vật tư (túi nilon, đầu nối…) có hình dạng lộn xộn, và túi, hộp con, bao bì chiếm thêm chỗ mà dữ liệu không đo. Hệ thống đã trừ sẵn 20% (nguyên lý 80/20) làm ngưỡng an toàn để lấy đồ dễ và không làm hỏng vật tư; phần còn lại là khoảng hở thực tế.</p>'
  +'<h3>3. Tại sao lại hiện số trên 100% (ví dụ 120%)?</h3><p>Đó là khi vật tư vượt quá ngưỡng an toàn của box (tức vượt 80% lòng box). Thanh sẽ đầy, chuyển đỏ đậm và hiện cảnh báo "Quá tải! Vượt ngưỡng an toàn" để nhắc cần phân bổ lại hàng hóa.</p></div>'
  +'<div class="pn" id="pnb"><h3>1. Cách tìm đồ nhanh</h3>'
  +'<div class="box bo"><b>Bước 1</b><p>Quét mã QR trên kệ (hoặc mở web). Gõ tên vật tư cần tìm.</p></div>'
  +'<div class="box bo"><b>Bước 2</b><p>Nhìn kết quả, ghi nhớ 2 thông tin: <b style="display:inline">Mã ô</b> (VD: F1.1.1.4) và <b style="display:inline">Số huy hiệu</b> (tem đỏ dán trên hộp).</p></div>'
  +'<div class="box bo"><b>Bước 3</b><p>Ra kệ, tìm thanh sắt ghi mã ô, rồi tìm hộp xanh có dán số huy hiệu tương ứng.</p></div>'
  +'<h3>2. Quy trình SOP lấy đồ (không xáo trộn kho)</h3>'
  +'<div class="box bg"><b>Quy tắc 1</b><p>Lấy đúng hộp, đúng số.</p></div>'
  +'<div class="box bg"><b>Quy tắc 2</b><p>Lấy xong phải trả về đúng vị trí cũ. Nghiêm cấm bỏ lộn sang hộp bên cạnh.</p></div>'
  +'<div class="box bg"><b>Quy tắc 3</b><p>Vuốt và buộc kín miệng túi nilon sau khi lấy.</p></div>'
  +'<div class="box bg"><b>Quy tắc 4</b><p>Nếu lấy hộp cuối cùng (hết sạch), nhắn Zalo báo Thủ kho để nạp thêm.</p></div></div>'
  +'<div class="pn" id="pnc"><h2 style="font-size:16px;margin:8px 0">🧭 Tìm vật tư &amp; Chỉ đường đi trên bản đồ</h2><p>Mở từ trang chủ: bấm dòng <b style="display:inline">🧭 Tìm vật tư &amp; chỉ đường</b>.</p>'
  +'<h3>1. Cách tìm kiếm</h3><div class="box bo"><b>Gõ gì cũng được</b><p>Tên vật tư (VD: <i>co khí nén phi 8</i>), SKU (<i>KN-0025</i>), mã KK (<i>KK-0043</i>) hoặc mã ô (<i>F1.1.1.7</i>). Không cần gõ dấu. Gõ càng nhiều từ càng chính xác; nếu không có dòng khớp đủ, hệ thống hiện dòng khớp gần nhất.</p></div>'

  +'<div class="box bo"><b>Tick nhiều dòng</b><p>Tick ≥2 dòng rồi chọn: <b style="display:inline">🔀 Phương án</b> (mỗi dòng 1 đường, chọn đường nào cũng được) hoặc <b style="display:inline">➡️ Đi 1 chuyến</b> (đi lần lượt qua tất cả dòng đã tick).</p></div>'

  +'<div class="box bg"><b>La bàn</b><p>Mũi tên đỏ chỉ thẳng tới ô cần lấy (lên = Bắc bản vẽ), kèm khoảng cách chim bay. Đổi Đường 1/2 thì mũi tên đổi theo.</p></div>'
  +'<div class="box bg"><b>Các bước đi</b><p>Danh sách "Đi hướng Bắc 1,4 m… rẽ Đông…" theo thứ tự, kết thúc bằng 🎯 Đích: cụm, tầng, ô và độ cao. Ô cao hơn 1,8 m thì cần xe thang.</p></div>'

  +'<h3>5. Đặt lại vị trí "Bạn đang ở đây"</h3><div class="box bg"><b>Chạm vào bản đồ</b><p>Chạm bất kỳ điểm nào để đặt vị trí của bạn; lộ trình, la bàn và các bước đi tính lại ngay. Bấm <b style="display:inline">Về cửa (O)</b> để quay về điểm xuất phát mặc định.</p></div></div></div>';
