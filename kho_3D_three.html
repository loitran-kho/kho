const KM={w:'w',a:'a',s:'s',d:'d',arrowup:'w',arrowdown:'s',arrowleft:'left',arrowright:'right',q:'up',e:'dn',shift:'sh'};
addEventListener('keydown',e=>{const k=KM[e.key.toLowerCase()];if(k&&mode==='walk'){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key.toLowerCase()];if(k)keys[k]=0});
const held=new Set();const relAll=()=>{held.forEach(k=>keys[k]=0);held.clear()};addEventListener('pointerup',relAll);addEventListener('pointercancel',relAll);addEventListener('blur',()=>{relAll();Object.keys(keys).forEach(k=>keys[k]=0)});
document.querySelectorAll('#walkui [data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{held.add(k);keys[k]=1;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>{keys[k]=0}});
[['bUp','up'],['bDn','dn']].forEach(([id,k])=>{const b=$(id);b.onpointerdown=e=>{held.add(k);keys[k]=1;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>{keys[k]=0}});
/* thang máy */
const lift=$('lift');lift.innerHTML='';for(let k=1;k<=7;k++){const z=KG.deckZ('F1.1',k),b=document.createElement('button');b.textContent='Tầng '+k+' · ≈ '+Math.round(z+350)+' mm';b.onclick=()=>{eyeT=Math.max(EYE0,Math.min(YMAX,(z+350)*M));auto=null;lift.style.display='none'};lift.appendChild(b)}
$('bLiftB').onclick=()=>{lift.style.display=lift.style.display==='flex'?'none':'flex'};$('bStop').onclick=()=>{Object.keys(keys).forEach(k=>keys[k]=0);held.clear();vel.set(0,0,0);vy=0;auto=null;eyeT=null;$('hSub').textContent='🛑 Đã dừng.'};$('bGround').onclick=()=>{eyeT=EYE0;auto=null;lift.style.display='none'};
/* dẫn đường */
const hasRoute=!!(route&&route.stops&&route.stops.length);if(!hasRoute)$('bGo').style.display='none';
$('bGo').onclick=()=>{if(!hasRoute)return;const pts=route.pts.slice(1,-1).map(p=>[p[0]*M,p[1]*M]);if(!pts.length)pts.push([camera.position.x,camera.position.z]);auto={pts,i:0,t:route.stops[route.stops.length-1]};eyeT=Math.max(EYE0,Math.min(YMAX,(auto.t.z+150)*M));$('hSub').textContent='🧭 Đang tự đi tới '+route.stops.map(s=>s.code).join(' → ')};
/* chạm chọn dãy kệ (chế độ quan sát) */
const ray=new THREE.Raycaster(),pickMeshes=PICK.map(p=>{const m=new THREE.Mesh(UB,new THREE.MeshBasicMaterial({visible:false}));m.scale.set(p.sx,p.sy,p.sz);m.position.set(p.x,p.y,p.z);m.userData.cl=p.cl;world.add(m);return m});
let dn=null;cv.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{if(mode!=='orbit'||!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>6)return;const r=cv.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),camera);const h=ray.intersectObjects(pickMeshes,false)[0],inf=$('info');
 if(!h){inf.style.display='none';return}const cl=h.object.userData.cl;inf.style.display='block';inf.innerHTML='Cụm <b>'+cl+'</b> · '+(clCnt[cl]||0)+' dòng vật tư · <a href="khung_3D.html#'+cl.replace(/\./g,'-')+'" target="_top">🧊 Mở 3D chi tiết cụm →</a> · <a href="tim_duong.html#go='+cl+'" target="_top">🧭 Chỉ đường</a>'});
/* ---------- vòng lặp ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}function lay(){const t=$('top').offsetHeight;$('hud').style.top=(t+16)+'px';$('info').style.top=(t+16+$('hud').offsetHeight+8)+'px'}addEventListener('resize',()=>{resize();lay()});resize();lay();setInterval(lay,700);
const clock=new THREE.Clock();let nt=0;
function walk(dt){
 const f=(keys.w?1:0)-(keys.s?1:0),s=(keys.d?1:0)-(keys.a?1:0),tr=(keys.right?1:0)-(keys.left?1:0),sp=(keys.sh?3.6:1.8);
 if(f||s||tr||keys.up||keys.dn){auto=null;eyeT=(keys.up||keys.dn)?null:eyeT}
 yaw-=tr*1.6*dt;
 const dir=new THREE.Vector3(-Math.sin(yaw)*f+Math.cos(yaw)*s,0,-Math.cos(yaw)*f-Math.sin(yaw)*s);if(dir.lengthSq()>1)dir.normalize();dir.multiplyScalar(sp);
 let tgtV=dir;
 if(auto){const p=auto.pts[auto.i];if(p){const dx=p[0]-camera.position.x,dz=p[1]-camera.position.z,d=Math.hypot(dx,dz);if(d<.4)auto.i++;else{tgtV=new THREE.Vector3(dx/d*2.2,0,dz/d*2.2);const hd=Math.atan2(-dx,-dz);let da=hd-yaw;da=Math.atan2(Math.sin(da),Math.cos(da));yaw+=da*Math.min(1,dt*4);pit+=(0-pit)*Math.min(1,dt*3)}}
  else{const t=auto.t,dx=t.fx*M-camera.position.x,dz=t.fy*M-camera.position.z,hd=Math.atan2(-(t.sx!==undefined?t.sx*0+dx:dx),-dz);tgtV=new THREE.Vector3();
   const tx=(t.fx+(t.side==='W'?-300:300))*M;const ddx=tx-camera.position.x,ddz=t.fy*M-camera.position.z;const hd2=Math.atan2(-ddx,-ddz);let da=hd2-yaw;da=Math.atan2(Math.sin(da),Math.cos(da));yaw+=da*Math.min(1,dt*3);
   const dh=(t.z*M)-camera.position.y,dd=Math.max(.4,Math.hypot(ddx,ddz));pit+=(Math.max(-.9,Math.min(.9,Math.atan2(dh,dd)))-pit)*Math.min(1,dt*3);
   if(Math.abs(da)<.03){auto=null;$('hSub').textContent='🎯 Đã tới nơi — ô vàng nhấp nháy trước mặt.'}}}
 if(tgtV.lengthSq()>0)vel.lerp(tgtV,1-Math.exp(-dt*6));else{vel.multiplyScalar(Math.exp(-dt*22));if(vel.length()<.05)vel.set(0,0,0)}    /* gia tốc / giảm tốc */
 const p=camera.position,nx=p.x+vel.x*dt,nz=p.z+vel.z*dt;if(!blocked(nx,p.z))p.x=nx;else vel.x=0;if(!blocked(p.x,nz))p.z=nz;else vel.z=0;
 let vyT=((keys.up?1:0)-(keys.dn?1:0))*1.8;if(eyeT!==null){const d=eyeT-p.y;vyT=Math.max(-2.5,Math.min(2.5,d*2.2));if(Math.abs(d)<.02)eyeT=null}
 vy+=(vyT-vy)*(1-Math.exp(-dt*(vyT?6:20)));p.y=Math.max(EYE0,Math.min(YMAX,p.y+vy*dt));
 bob+=vel.length()*dt*2.2;const mv=Math.min(1,vel.length()/1.8);hands.position.y=Math.sin(bob*2)*.012*mv;hands.position.x=Math.cos(bob)*.01*mv;
 camera.rotation.set(pit,yaw,0,'YXZ')}
renderer.setAnimationLoop(()=>{const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 if(mode==='walk')walk(dt);else orbit.update();
 const k=.5+.5*Math.sin(t*6);tgtMat.emissiveIntensity=.3+.9*k;beamMat.opacity=.15+.3*k;
 pivot.rotation.x+=(rollT-pivot.rotation.x)*Math.min(1,dt*4);if(mode==='orbit'&&camera.position.y<.2){camera.position.y=.2}
 $('hAlt').textContent=(mode==='walk'?'Độ cao hiện tại: ':'Camera cách sàn: ')+Math.round(Math.max(0,camera.position.y/M))+' mm';
 if((nt+=dt)>.25){nt=0;updNums()}
 renderer.render(scene,camera)});
window.K3={setMode,resetView,camera,scene,state:()=>({mode,yaw,pit,pos:camera.position.toArray(),cells:CELLN.length,tgt:TGT.length})};
if(/walk=1/.test(location.hash))setMode('walk');
</script></body></html>
